name: ARM64 Semantic Verify & iOS Cross-Compile Probe

on:
  workflow_dispatch:
    inputs:
      run_macos:
        description: '也跑 macOS runner（配额受限，默认不跑）'
        default: 'false'
        required: false
  push:
    paths:
      - 'runtime/**'
      - 'tests/**' 

jobs:
  # 主路径：Linux 交叉编译 aarch64 + QEMU 跑真 ARM64 指令（不依赖 macOS 配额）
  arm64-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            cmake ninja-build g++ python3-pip curl \
            g++-aarch64-linux-gnu qemu-user
          python3 -m pip install --quiet lief
          aarch64-linux-gnu-g++ --version | head -1
          qemu-aarch64 --version | head -1

      - name: Install Zydis (host)
        run: |
          if ! sudo apt-get install -y -qq libzydis-dev; then
            git clone --depth 1 --branch v4.1.0 https://github.com/zyantific/zydis.git /tmp/zydis
            cmake -S /tmp/zydis -B /tmp/zydis/build -G Ninja -DZYDIS_BUILD_TESTS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_TOOLS=OFF > /dev/null
            cmake --build /tmp/zydis/build -j"$(nproc)" > /dev/null
            sudo cmake --install /tmp/zydis/build > /dev/null
            sudo ldconfig
          fi

      - name: Fetch exe + build lifter
        run: |
          curl -fL -o Mewgenics.exe https://raw.githubusercontent.com/871554520/mew-decomp/main/Mewgenics.exe
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target mew_lifter -j"$(nproc)"

      - name: hello probe (qemu sanity)
        run: |
          printf '#include <cstdio>\nint main(){std::printf("hello-arm64\\n");return 42;}\n' > /tmp/hello.cpp
          aarch64-linux-gnu-g++ -O2 /tmp/hello.cpp -o /tmp/hello_dyn
          qemu-aarch64 -L /usr/aarch64-linux-gnu /tmp/hello_dyn || true
          echo "dyn rc=$?"
          aarch64-linux-gnu-g++ -O2 -static /tmp/hello.cpp -o /tmp/hello_static
          qemu-aarch64 /tmp/hello_static || true
          echo "static rc=$?"

      - name: Stage 2 golden hash on ARM64 (qemu)
        run: |
          mkdir -p generated
          ./build/mew_lifter --lift 0x1401657b0 --exe Mewgenics.exe --out generated/lifted.cpp
          python3 tools/stage2_wrap.py 1401657b0 generated/wrapper.cpp
          aarch64-linux-gnu-g++ -std=c++17 -O0 -g -rdynamic -I runtime/include \
            tests/stage2/native_harness.cpp generated/lifted.cpp generated/wrapper.cpp \
            -o build/native_harness_arm64
          : > generated/arm64_stage2.txt
          # 0x1401657b0 的 ptr_mask=0xb（rcx/rdx/r8 是缓冲区指针），必须与 x86 侧一致
          for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
            qemu-aarch64 -L /usr/aarch64-linux-gnu ./build/native_harness_arm64 0xb $ARGS >> generated/arm64_stage2.txt 2>> generated/arm64_stage2.err || true
            echo "harness rc=$?" >> generated/arm64_stage2.txt
          done
          echo '--- stderr ---'; cat generated/arm64_stage2.err || true
          echo "expected: rax=0 hash=9509283584686752643"
          echo '--- arm64 stage2 raw output ---'
          cat generated/arm64_stage2.txt
          PASS=$(grep -c '"rax": 0, "h": 9509283584686752643' generated/arm64_stage2.txt || true)
          echo "arm64 stage2 matches=$PASS/4"
          test "$PASS" -eq 4

      - name: Stage 4 nested golden hash on ARM64 (qemu)
        # 必须和 stage3 一致地开 chaininfo 家族合并，否则 Stage 4 的嵌套候选会用
        # `.pdata` 原始长度去 lift：0x140bb0660 只有 0x1b 字节，fall-through 到
        # 0x140bb067b（它的 chaininfo 续段）就变成 dispatch，而 nested PoC 不跑
        # reflow，派发表里没有这条 → FATAL Unmapped indirect target（run 46021919377）。
        env:
          MEW_SPLIT_CHAIN: "1"
        run: |
          mkdir -p generated
          : > generated/arm64_stage4.txt
          BEST=0
          for K in 0 1 2 3 4 5 6 7; do
            if ! ./build/mew_lifter --pick-nested --skip $K \
              --exe Mewgenics.exe --out generated/nested.txt > /dev/null 2>&1; then
              echo "no candidate at skip=$K"; break
            fi
            MASK=$(awk '/^# root/{for(i=1;i<=NF;i++) if($i ~ /^mask=/) print substr($i,6)}' generated/nested.txt)
            ROOT=$(awk '/^# root/{print $3}' generated/nested.txt | sed 's/va=0x//')
            echo "candidate skip=$K root=0x$ROOT mask=$MASK"
            rm -rf generated/stage4 && mkdir -p generated/stage4
            ./build/mew_lifter --shards 1 --only generated/nested.txt --seeds-inside tools/known_internal_labels.txt \
              --out-dir generated/stage4 --exe Mewgenics.exe > /dev/null 2>&1
            python3 tools/stage2_wrap.py "$ROOT" generated/nested_wrap.cpp > /dev/null
            if ! aarch64-linux-gnu-g++ -std=c++17 -O0 -g -rdynamic -I runtime/include -I generated/stage4 \
                 tests/stage4/native_nested.cpp generated/stage4/shard_000.cpp \
                 generated/stage4/dispatch_table.cpp generated/stage4/shims_auto.cpp \
                 runtime/src/pe_image_loader.cpp generated/nested_wrap.cpp \
                 -o build/native_nested_arm64 2> generated/nested_build_$K.log; then
              echo "skip=$K build failed"; tail -5 generated/nested_build_$K.log; continue
            fi
            : > generated/try4.txt
            for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
              qemu-aarch64 -L /usr/aarch64-linux-gnu ./build/native_nested_arm64 "${MASK:-15}" $ARGS >> generated/try4.txt 2>> generated/arm64_stage4.err || true
            done
            N=$(grep -c '"rax": 0, "h": 9509283584686752643' generated/try4.txt || true)
            echo "skip=$K matches=$N/4"
            if [ "$N" -eq 4 ]; then cp generated/try4.txt generated/arm64_stage4.txt; BEST=1; break; fi
          done
          echo '--- arm64 stage4 raw output ---'
          cat generated/arm64_stage4.txt
          echo '--- stderr tail ---'; tail -10 generated/arm64_stage4.err || true
          test "$BEST" -eq 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-qemu-out
          path: |
            generated/arm64_stage2.txt
            generated/arm64_stage2.err
            generated/arm64_stage4.txt
            generated/arm64_stage4.err
          if-no-files-found: warn

  arm64-macos:
    # 备用：macOS runner（账号配额受限，默认不跑，避免平台取消把整条 run 染红）
    if: ${{ inputs.run_macos == 'true' }}
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install zydis cmake ninja
          cmake --version | head -1
          uname -m

      - name: Fetch exe
        run: |
          curl -fL -o Mewgenics.exe https://raw.githubusercontent.com/871554520/mew-decomp/main/Mewgenics.exe
          test -s Mewgenics.exe
          ls -l Mewgenics.exe

      - name: Build lifter
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target mew_lifter -j 4

      - name: Stage 2 golden hash on native ARM64
        run: |
          mkdir -p generated
          ./build/mew_lifter --lift 0x1401657b0 --exe Mewgenics.exe --out generated/lifted.cpp
          python3 tools/stage2_wrap.py 1401657b0 generated/wrapper.cpp
          c++ -std=c++17 -O2 -I runtime/include \
            tests/stage2/native_harness.cpp generated/lifted.cpp generated/wrapper.cpp \
            -o build/native_harness
          : > generated/arm64_stage2.txt
          for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
            ./build/native_harness 0 $ARGS | tee -a generated/arm64_stage2.txt
          done
          echo "expected: rax=0 hash=9509283584686752643"
          echo '--- arm64 stage2 raw output ---'
          cat generated/arm64_stage2.txt
          PASS=$(grep -c '"rax": 0, "h": 9509283584686752643' generated/arm64_stage2.txt || true)
          echo "arm64 stage2 matches=$PASS/4"
          test "$PASS" -eq 4

      - name: Stage 4 nested golden hash on native ARM64
        # 必须和 stage3 一致地开 chaininfo 家族合并，否则 Stage 4 的嵌套候选会用
        # `.pdata` 原始长度去 lift：0x140bb0660 只有 0x1b 字节，fall-through 到
        # 0x140bb067b（它的 chaininfo 续段）就变成 dispatch，而 nested PoC 不跑
        # reflow，派发表里没有这条 → FATAL Unmapped indirect target（run 46021919377）。
        env:
          MEW_SPLIT_CHAIN: "1"
        run: |
          mkdir -p generated/stage4
          ./build/mew_lifter --pick-nested \
            --exe Mewgenics.exe --out generated/nested.txt
          ./build/mew_lifter --shards 1 --only generated/nested.txt \
            --seeds-inside tools/known_internal_labels.txt \
            --out-dir generated/stage4 --exe Mewgenics.exe
          ROOT=$(awk '/^# root/{print $3}' generated/nested.txt | sed 's/va=0x//')
          python3 tools/stage2_wrap.py "$ROOT" generated/nested_wrap.cpp
          c++ -std=c++17 -O2 -I runtime/include -I generated/stage4 \
            tests/stage4/native_nested.cpp generated/stage4/shard_000.cpp \
            generated/stage4/dispatch_table.cpp generated/stage4/shims_auto.cpp \
            runtime/src/pe_image_loader.cpp generated/nested_wrap.cpp \
            -o build/native_nested
          : > generated/arm64_stage4.txt
          for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
            ./build/native_nested 0 $ARGS | tee -a generated/arm64_stage4.txt
          done
          echo "expected: rax=0 hash=9509283584686752643"
          echo '--- arm64 stage4 raw output ---'
          cat generated/arm64_stage4.txt
          PASS=$(grep -c '"rax": 0, "h": 9509283584686752643' generated/arm64_stage4.txt || true)
          echo "arm64 stage4 matches=$PASS/4"
          test "$PASS" -eq 4

      - name: iOS arm64 cross-compile probe
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_CXX_FLAGS="-O2 -fno-exceptions -fno-rtti"
          cmake --build build-ios --target mew_runtime -j 4
          echo "iOS probe OK: mew_runtime built for arm64-apple-ios"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-verify-out
          path: |
            generated/arm64_stage2.txt
            generated/arm64_stage2.err
            generated/arm64_stage4.txt
            generated/arm64_stage4.err
            generated/nested.txt
          if-no-files-found: warn
