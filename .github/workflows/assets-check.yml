name: Assets check (range probes only, no full 5.1 GB download)

# 目的：验证仓库 secret MEW_ASSET_URL_GPak 里的预签名直链可用。
# 只发 3 个 Range 请求（几十字节），不下载 5.1 GB，所以 1 分钟内出结果。
# 注意：预签名绑定 HTTP 方法，这里全部用 GET（-r 0-0 也能拿到响应头），不用 curl -sI。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe the presigned gpak URL
        env:
          MEW_ASSET_URL_GPak: ${{ secrets.MEW_ASSET_URL_GPak }}
          # 公有读直链（大肥鱼 2026-11-28 提供；桶本来就是公有读，匿名 GET 返回 206）。
          # secret 存在且是 https URL 时优先用 secret，否则用这个。
          MEW_ASSET_PUBLIC_URL: "https://dsh-1-1544009507.cos.ap-guangzhou.myqcloud.com/resources.gpak"
        run: |
          # 先只打"形状"，不打内容：行数 + 每行长度 + 每行前 8 个字符（足够区分 scheme 和噪声，不泄露签名）
          echo "[check] secret total bytes = ${#MEW_ASSET_URL_GPak}"
          printf '%s' "${MEW_ASSET_URL_GPak:-}" | awk '{printf "[check] line %d: len=%d head=%s\n", NR, length($0), substr($0,1,8)}'

          # 公有直链兜底：secret 没设/不是 URL 时直接用它（非凭证，可公开）
          if ! printf '%s' "${MEW_ASSET_URL_GPak:-}" | grep -q 'https://'; then
            echo "[check] secret has no https URL -> using public URL"
            MEW_ASSET_URL_GPak="${MEW_ASSET_PUBLIC_URL}"
          fi
          # 容错：优先取第一行；若不是 https，则逐行找第一个 https 行；再不行把各行拼起来找 https 片段
          RAW="${MEW_ASSET_URL_GPak:-}"
          URL=$(printf '%s' "$RAW" | head -n1 | tr -d '\r')
          URL=${URL#GET=}
          if ! printf '%s' "$URL" | grep -q '^https://'; then
            URL=$(printf '%s' "$RAW" | tr -d '\r' | grep -o 'https://[^[:space:]]*' | head -n1)
          fi
          if ! printf '%s' "$URL" | grep -q '^https://'; then
            echo "[check] could not find an https URL anywhere in the secret"; exit 1
          fi
          echo "[check] url accepted, len=${#URL}" 

          echo "--- headers via ranged GET (expect 206 + Content-Range + Content-Length) ---"
          curl -s -D - -o /dev/null -r 0-0 "$URL" | tr -d '\r' | grep -Ei '^(HTTP/|content-length|content-range|accept-ranges|etag|last-modified)'

          echo "--- first 16 bytes (expect 0b4e0000 1400 'audio/comb...') ---"
          curl -s -r 0-15 "$URL" | xxd

          echo "--- data area start, offset 824693 (expect 'SetName CombatSFX') ---"
          curl -s -r 824693-824724 "$URL" | xxd

          echo "--- last 8 bytes (expect PNG IEND: 49454e44 ae426082) ---"
          curl -s -r 5134616308-5134616315 "$URL" | xxd
