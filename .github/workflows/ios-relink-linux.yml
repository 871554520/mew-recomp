name: iOS relink (Linux 结构校验)
on:
  workflow_dispatch:
  push:
    paths:
      - tools/elf2macho_dylib.py
      - ios_port/verify_macho.py
      - .github/workflows/ios-relink-linux.yml
concurrency:
  group: ios-relink-linux
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 组装 APK + 抽 libmain.so
        run: |
          cat ios_port/vendor/apk_part_*.bin > /tmp/app.apk
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/app.apk')
          open('/tmp/libmain.so','wb').write(z.read('lib/arm64-v8a/libmain.so'))
          print('libmain.so extracted')
          PY
          ls -l /tmp/libmain.so
      - name: ELF -> Mach-O
        run: |
          python3 tools/elf2macho_dylib.py /tmp/libmain.so -o /tmp/libmew_relinked.dylib --platform ios
          ls -l /tmp/libmew_relinked.dylib
      - name: 结构校验（等价 otool -l / dyld_info -exports）
        run: |
          python3 ios_port/verify_macho.py /tmp/libmew_relinked.dylib
      - name: llvm-objdump --macho（官方工具链，不抢 macOS 队列）
        run: |
          set -o pipefail
          command -v llvm-objdump >/dev/null || (sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq llvm)
          OBJDUMP=$(command -v llvm-objdump || echo /usr/lib/llvm-18/bin/llvm-objdump)
          echo "using $OBJDUMP"
          D=/tmp/libmew_relinked.dylib
          # llvm-objdump 只要往 stderr 打过一句诊断就以 1 退出，采样阶段先关掉 -e
          set +e
          $OBJDUMP --macho --private-headers $D > /tmp/o_headers.txt 2>&1; echo "rc_headers=$?"
          $OBJDUMP --macho --exports-trie  $D > /tmp/o_exports.txt 2>&1; echo "rc_exports=$?"
          $OBJDUMP --macho --rebase        $D > /tmp/o_rebase.txt  2>&1; echo "rc_rebase=$?"
          $OBJDUMP --macho --bind          $D > /tmp/o_bind.txt    2>&1; echo "rc_bind=$?"
          set -e
          echo "===== private-headers (head) ====="; head -60 /tmp/o_headers.txt
          echo "===== exports-trie (head) =====";    head -12 /tmp/o_exports.txt
          echo "===== rebase (head) =====";          head -5  /tmp/o_rebase.txt
          echo "===== bind (head) =====";            head -5  /tmp/o_bind.txt
          echo "===== 计数（只数带 0x 地址的条目行，去掉 4 行表头）====="
          RB=$(grep -c '0x' /tmp/o_rebase.txt || true)
          BD=$(grep -c '0x' /tmp/o_bind.txt || true)
          echo "rebase_total=$RB"
          echo "bind_total=$BD"
          echo "===== malformed 门禁 ====="
          if grep -n -E 'malformed|inconsistent|bad offset|bad segIndex|too large|Unknown' /tmp/o_*.txt; then
            echo "::error::llvm-objdump 报出结构错误，Mach-O 未过关"
            exit 1
          fi
          echo "no malformed"
          if ! grep -q '_SDL_main' /tmp/o_exports.txt; then
            echo "::error::export trie 里没有 _SDL_main"
            exit 1
          fi
          grep -m1 '_SDL_main' /tmp/o_exports.txt
          if [ "$RB" != "76945" ] || [ "$BD" != "1348" ]; then
            echo "::error::计数不符：rebase=$RB（期望 76945）bind=$BD（期望 1348）"
            exit 1
          fi
          echo "计数吻合 76945 / 1348"

      - name: 十六进制抽查
        run: |
          python3 - <<'PY'
          import struct
          d=open('/tmp/libmew_relinked.dylib','rb').read()
          print('header:', d[:32].hex())
          print('size:', len(d))
          print('magic:', hex(struct.unpack_from('<I',d,0)[0]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relink-linux
          path: /tmp/libmew_relinked.dylib
