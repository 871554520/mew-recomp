      # 日志接口要 admin 权限（403），artifact 也要 token。把本轮诊断摘要
      # force-push 到一个孤儿分支，任何人用 raw.githubusercontent 就能读。
      # 设成 always + continue-on-error：这一步失败绝不影响构建结论。
      - name: 发布诊断摘要到分支 ci-diag-stage3
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ci-diag-stage3
          FILE: diag-summary.txt
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          {
            echo "repo=${{ github.repository }} run=${{ github.run_id }} sha=${{ github.sha }} at=$(date -u +%FT%TZ)"
            echo "compile_errors=$(grep -c 'error:' generated/compile.log 2>/dev/null)"
            echo "unimpl_api_lines=$(grep -c '\[UNIMPL API\]' generated/runner.err 2>/dev/null)"
            echo "unimpl_insn_lines=$(grep -c '\[UNIMPL INSN\]' generated/runner.err 2>/dev/null)"
            echo "unimpl_func_lines=$(grep -c '\[UNIMPL FUNC\]' generated/runner.err 2>/dev/null)"
            echo
            echo '===== UNIMPL API TABLE（聚合表）====='
            grep -A30 'UNIMPL API TABLE' generated/runner.err 2>/dev/null | head -36
            echo
            echo '===== runner.err 末尾 30 行 ====='
            tail -30 generated/runner.err 2>/dev/null
            echo
            echo '===== runner_b（第二次构建，600s/120s 长跑）====='
            tail -25 generated/runner_b.err 2>/dev/null
            echo
            echo '===== runner_nosafe（关 SAFE_MEM，看真崩溃点）====='
            grep -A14 '\[CRASH\]' generated/runner_nosafe.err 2>/dev/null | head -20
            echo
            echo '===== SEH 派发统计 ====='
            grep -E 'RESUME|unhandled|handler 0x|seh' generated/runner_se.err 2>/dev/null | head -20
            echo
            echo '===== gpak（资源包）路径 ====='
            grep -E 'resources\.gpak|CreateFileW|GPAK' generated/runner.err generated/gpak_*.err 2>/dev/null | head -20
            echo
            echo '===== ABI 违规（前 10）====='
            grep 'ABI VIOLATION' generated/runner_nosafe.err generated/runner_b.err 2>/dev/null | head -10
            echo
            echo '===== 宿主链接（mew_runner 编译）日志末尾 40 行 ====='
            tail -40 generated/runner_build.log 2>/dev/null
            echo
            echo '===== Gate3 链接日志末尾 15 行 ====='
            tail -15 generated/link.log 2>/dev/null
            echo
            echo '===== 分片编译错误（若有）====='
            grep -m 10 'error:' generated/compile.log 2>/dev/null
          } > diag-summary.txt
          wc -l diag-summary.txt
          # 公开通道：GitHub annotation（由 Actions 服务发布，不需要仓库写权限）。
          # 日志接口要 admin、artifact 要 token、contents 写权限在账号级被降级成只读，
          # 三种都试过了；annotation 是唯一「谁都能读」的通道（check-runs/annotations API）。
          # 内容 base64 后塞进单条 notice，本地解码即得完整摘要。
          head -c 60000 diag-summary.txt > /tmp/diag-small.txt 2>/dev/null || cp diag-summary.txt /tmp/diag-small.txt
          python3 - <<'PY'
          import base64, os
          data = open('/tmp/diag-small.txt', 'rb').read()
          print('::notice title=diag-b64::' + base64.b64encode(data).decode())
          PY
