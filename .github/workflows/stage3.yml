name: Stage 3 full translate + Stage 4 nested PoC

on:
  push:
    paths:
      - '.stage3-trigger'
  workflow_dispatch:
    inputs:
      real_threads:
        description: '1 = 打开 MEW_REAL_THREADS（真 pthread + 每线程 X64Ctx）；默认 0 = 基线'
        default: '0'
        required: false
      main_va:
        description: '可选：覆盖链尾补调的入口（默认空=0x1409b5230 直调 main；填 0x1409b5140 走 SDL_RunApp）'
        default: ''
        required: false
      assets:
        description: '1 = 准备 resources.gpak（有 secret 下真包，没有则稀疏回退）；默认 0 = 完全不碰资源，保持旧基线'
        default: '0'
        required: false

# 推送触发：同一时间只留一轮（新提交顶掉旧轮，避免抢 runner）。
# 手动 workflow_dispatch：每轮独立 group，不 cancel 正在跑的轮次（补跑被顶掉的 ref 时不再误杀）。
concurrency:
  group: stage3-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'full' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # 真线程开关（**默认关**，基线不变）。判据来自 run 46061908947：
      # `SleepConditionVariableSRW(INFINITE)` 单线程语义下无条件返回 TRUE，MSVC 的
      # _Cnd_wait（0x140d1f7e4，67 字节）以为被唤醒 -> 重新持锁 -> 谓词仍假 -> 再 wait，
      # 单线程下没有任何线程能把它唤醒 -> [LIVELOCK] 20,000,000 次后 abort。
      # 打开后 CreateThread 起真 pthread、每线程一份 X64Ctx（4 MB 栈 + 伪 TEB），
      # 条件变量/事件类句柄换成真 condvar，WaitForSingleObject 对线程句柄 join。
      # 只有 workflow_dispatch 能打开：push 轮恒为 '0'，避免和别的变量混在一轮。
      MEW_REAL_THREADS: ${{ github.event.inputs.real_threads || '0' }}
      # 链尾补调的入口地址。空 = 用 runner 内置的 0x1409b5230（直调 main）；
      # 填 0x1409b5140 = 走 SDL_RunApp（那条会自己构造 argc/argv 并回调 app 入口）。
      # run 46076441393 的 trace 证明 0x1409b5140 在我们的模拟里一次都没被进入，
      # 而 PeekMessageW/GetMessageW 全是 0——所以要用这一项做对照。
      MEW_MAIN_VA: ${{ github.event.inputs.main_va }}

    # 末尾要把诊断摘要 force-push 到 ci-diag-stage3 分支（公开可读，免 token 取日志）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -x
          # 镜像里 cmake/ninja/g++/python3 通常已预装，缺什么装什么；
          # 每个 apt 调用都限时，避免镜像源卡死把整条流水线挂住（实测挂过 50 分钟）。
          need=""
          command -v cmake   >/dev/null || need="$need cmake"
          command -v ninja   >/dev/null || need="$need ninja-build"
          command -v g++     >/dev/null || need="$need g++"
          command -v clang   >/dev/null || need="$need clang"
          command -v python3 >/dev/null || need="$need python3"
          if [ -n "$need" ]; then
            sudo timeout 240 apt-get update -qq || echo "apt update timeout/ignored"
            sudo DEBIAN_FRONTEND=noninteractive timeout 420 apt-get install -y -qq $need || echo "apt install partial"
          fi
          command -v x86_64-w64-mingw32-g++ >/dev/null || \
            sudo DEBIAN_FRONTEND=noninteractive timeout 420 apt-get install -y -qq gcc-mingw-w64-x86-64 || true
          if ! command -v wine >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y -qq wine wine64 \
              || sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y -qq wine64 \
              || echo "WARN: wine install failed"
          fi
          command -v wine || echo "WARN: wine 不可用，Gate1/Stage4 会跳过"
          command -v Xvfb >/dev/null || \
            sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -qq xvfb || true
          python3 -c "import lief" 2>/dev/null || timeout 180 python3 -m pip install --quiet lief || true
          nproc; (g++ --version | head -1) || true; command -v x86_64-w64-mingw32-g++ || true

      - name: Install Zydis
        run: |
          set -e
          if [ -f /usr/include/Zydis/Zydis.h ]; then
            echo "zydis already present"
          elif ! sudo timeout 300 apt-get install -y -qq libzydis-dev; then
            git clone --depth 1 --branch v4.1.0 https://github.com/zyantific/zydis.git /tmp/zydis
            cmake -S /tmp/zydis -B /tmp/zydis/build -G Ninja -DZYDIS_BUILD_TESTS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_TOOLS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
            cmake --build /tmp/zydis/build -j"$(nproc)" > /dev/null
            sudo cmake --install /tmp/zydis/build > /dev/null
            sudo ldconfig
          fi
          ls /usr/include/Zydis/Zydis.h

      - name: Fetch exe
        run: |
          curl -fL -o Mewgenics.exe https://raw.githubusercontent.com/871554520/mew-decomp/main/Mewgenics.exe
          ls -l Mewgenics.exe

      - name: Prepare assets (real gpak if URL provided, else header + holes)
        env:
          # 用户把真包直链存成仓库 secret 后，这一步自动改走下真包；没设就仍是稀疏回退。
          # 用 secret 而不是硬编码：预签名 URL 本身就是凭证，不该进仓库也不该进日志。
          MEW_ASSET_URL_GPak: ${{ secrets.MEW_ASSET_URL_GPak }}
          # 公有读直链（桶本身公有读，匿名 GET 206）；secret 里有可用 URL 时优先用 secret。
          MEW_ASSET_PUBLIC_URL: "https://dsh-1-1544009507.cos.ap-guangzhou.myqcloud.com/resources.gpak"
        run: |
          if [ "${{ github.event.inputs.assets || '0' }}" != "1" ]; then
            echo "[assets] disabled for this run (inputs.assets != 1) -> no resources.gpak on disk"
            exit 0
          fi
          # secret 里可能有两行（第一行 GET 直链，第二行 HEAD=... 给 curl -sI 用）。
          # 只取第一行，去掉 CR 和可能残留的 "GET=" 前缀 —— 否则换行会把 URL 拼坏，表现为 403。
          URL=$(printf '%s' "${MEW_ASSET_URL_GPak:-}" | head -n1 | tr -d '\r')
          URL=${URL#GET=}
          if ! printf '%s' "$URL" | grep -q '^https://'; then
            echo "[assets] secret has no usable URL -> using public read URL"
            URL="${MEW_ASSET_PUBLIC_URL}"
          fi
          case "$URL" in
            https://*) echo "[assets] presigned GET url accepted (len=${#URL})" ;;
            *) echo "[assets] first line is not an https URL (len=${#URL}) -> sparse fallback"; URL="" ;;
          esac

          if [ -n "$URL" ]; then
            echo "[assets] downloading real resources.gpak (resume enabled)"
            curl -fL -C - --retry 5 --retry-delay 3 --retry-connrefused \
                 -o resources.gpak "$URL"
            ls -l resources.gpak
            python3 -c "import os;n=os.path.getsize('resources.gpak');print('[assets] bytes =',n,'expected 5134616316','OK' if n==5134616316 else 'MISMATCH')"
            sha256sum resources.gpak | cut -c1-32 || true
          else
            echo "[assets] sparse fallback: directory table + zero-filled data area"
            truncate -s 5134616316 resources.gpak
            dd if=assets/gpak-dir.bin of=resources.gpak conv=notrunc bs=4096
            ls -l resources.gpak
          fi
          python3 -c "import struct;f=open('resources.gpak','rb');print('gpak count =',struct.unpack('<I',f.read(4))[0]);f.seek(824693);print('first obj head =',f.read(32))"
          mkdir -p swfs
      - name: Build lifter
        run: |
          mkdir -p generated
          set +e
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release > generated/build.log 2>&1
          cmake --build build -j"$(nproc)" >> generated/build.log 2>&1
          rc=$?
          tail -40 generated/build.log
          exit $rc

      - name: ISA histogram + Top50 report
        run: |
          ./build/isa_histogram Mewgenics.exe generated/isa_histogram.json
          python3 tools/summarize_isa.py generated/isa_histogram.json generated/isa_freq.tsv | tee generated/isa_report.txt

      - name: CFG load-config probe
        run: |
          python3 tools/cfg_info.py Mewgenics.exe generated/cfg.json 2>&1 | tee generated/cfg_probe.txt

      - name: Find gpak loader (string xref)
        run: |
          for S in "resources.gpak" ".gpak" "gpak"; do
            echo "===== $S ====="
            ./build/mew_lifter --find-string "$S" --exe Mewgenics.exe 2>&1 | tee -a generated/gpak_xref.txt
          done

      - name: Find gpak callers
        run: |
          ./build/mew_lifter --find-callers 0x1409b5380 --exe Mewgenics.exe 2>&1 | tee -a generated/gpak_xref.txt

      - name: Stub mnemonic histogram
        run: |
          ./build/mew_lifter --stub-hist --exe Mewgenics.exe 2>&1 | tee generated/stub_hist.txt

      - name: Mine hidden entries (.reloc + GFIDS)
        run: |
          python3 tools/mine_hidden_entries.py Mewgenics.exe generated/pe_meta.json generated/extra_seeds.txt 2>&1 | tee generated/seeds.log
          wc -l generated/extra_seeds.txt || true
          # 手工登记的额外种子（tools/extra_seed_labels.txt → --seeds 通道）：
          # 目标地址不在任何 .pdata 区间内时 seeds-inside 会被 verify_lists.py 拒，只能从这里进。
          if [ -s tools/extra_seed_labels.txt ]; then
            grep -E '^0x[0-9a-fA-F]+$' tools/extra_seed_labels.txt | sort -u >> generated/extra_seeds.txt
            echo "manual extra seeds: $(grep -cE '^0x[0-9a-fA-F]+$' tools/extra_seed_labels.txt)"
          fi

      # 「函数中间标签」= 跳转表的 case。这些地址落在已翻译函数的内部，
      # 必须走 --seeds-inside（addExtraEntriesAllowInside），走 --seeds 会被
      # addExtraEntriesImpl 的 inside_known 判断直接丢掉。
      # 注意区分：跳转表 case 原地以 ret 收尾，弹的是调用者的返回地址，作为独立
      # 入口是正确的；而共享尾声（add rsp,0x20; pop rbx; ret）作为入口会错位，
      # 那种由 lifter 的 LIFT_FRAGMENT 在所属函数内处理，不要往这里塞。
      - name: Mine jump-table case labels (inside-function entries)
        run: |
          python3 tools/mine_jump_tables.py Mewgenics.exe generated/jump_table_labels.txt 2>&1 | tee generated/jump_tables.log
          : > generated/inside_seeds.txt
          if [ -s generated/jump_table_labels.txt ]; then
            grep -E '^0x[0-9a-fA-F]+$' generated/jump_table_labels.txt >> generated/inside_seeds.txt || true
          else
            echo "WARN: jump table miner produced no labels"
          fi
          if [ -s tools/known_internal_labels.txt ]; then
            grep -E '^0x[0-9a-fA-F]+$' tools/known_internal_labels.txt >> generated/inside_seeds.txt || true
          fi
          sort -u generated/inside_seeds.txt -o generated/inside_seeds.txt
          grep -vc '^#' generated/inside_seeds.txt || true

      - name: Generate 64 shards + dispatch table + shims
        env:
          # chaininfo 家族自动补长（见 lifter/src/lifter_core.cpp 的 chain_family_spans）：
          # 用 .pdata 的 UNW_FLAG_CHAININFO 元数据把「各段 VA 连续」的拆段家族并成一条。
          # 实测证据：0x14004ba20 / 0x140048010 / 0x140062450 / 0x140c11370 这些
          # 手工逐条白名单过的家族，续段上**都带 CHAININFO**（首段 flags=0、续段 flags=4，
          # chain.BeginAddress 回指首段）——也就是说这一族本来就能被自动规则覆盖，
          # 之前一直靠人工逐条补是因为开关没开。
          # 全镜像 3,574 个段连续家族（共 14,972 段）；段间有空隙的 1,017 个规则不动。
          MEW_SPLIT_CHAIN: "1"
        run: |
          mkdir -p generated/stage3
          ./build/mew_lifter --shards 64 --out-dir generated/stage3 --exe Mewgenics.exe \
            --seeds generated/extra_seeds.txt \
            --seeds-inside generated/inside_seeds.txt 2>&1 | tee generated/shards.log
          du -sh generated/stage3
          ls generated/stage3 | head
          head -3 generated/stage3/manifest.tsv
          wc -l generated/stage3/all_decls.h generated/stage3/dispatch_table.cpp

      - name: Dump hot functions (debug)
        run: |
          # 140386180 / 140386250 / 1403862d0 是 std::_Hash 的 rehash 路径（算新桶数、链入、
          # 2^59 上限校验），140385f80 是调用它们的 insert(range) 本体。这四个必须成组看：
          # 只看反汇编判断不了 lifter 有没有翻对（bsr 曾被映射成 clz），而 `--lift` 单函数
          # 模式遇到 call 就 ok=0、函数中间地址又不在 .pdata —— 唯一可靠来源就是这里。
          for VA in 140d6ee24 140d6ee34 140d6ee3c 140d6ca68 140d6cb90 140d79870 140d79928 140d79600 140d6ceb4 140d6e8bc 140d6cd78 140d6d1f8 140d6bc64 140d70c00 140385f80 140386180 140386250 1403862d0 140be0a60 14038634e; do
            echo "===== sub_$VA ====="
            awk "/void sub_$VA\\(X64Ctx/,/^}/" generated/stage3/shard_*.cpp | head -900
          done | tee generated/hot_functions.txt
          grep -c '^===== ' generated/hot_functions.txt
          wc -l generated/hot_functions.txt

      - name: Compile all shards -> libmew_recomp.a
        run: |
          set -o pipefail
          python3 tools/build_stage3.py \
            --src-dir generated/stage3 --obj-dir build-stage3 \
            --archive build-stage3/libmew_recomp.a --jobs "$(nproc)" --opt=-O0 2>&1 | tee generated/compile.log
          RC=$?
          echo "compile rc=$RC"
          if [ $RC -ne 0 ]; then
            echo '--- print offending shard lines ---'
            grep -m1 -h 'error:' generated/compile.log | sed -E 's/.*shard_[0-9]+\.cpp:([0-9]+):.*/\1/' | while read -r LN; do
              grep -h 'shard_' generated/compile.log | head -1 >/dev/null
            done
            for F in $(grep -h -o 'generated/stage3/shard_[0-9]*\.cpp' generated/compile.log | sort -u | head -3); do
              LN=$(grep -m1 "$F:" generated/compile.log | sed -E 's/.*:([0-9]+):[0-9]+: error.*/\1/')
              echo "== $F line $LN =="
              sed -n "$((LN-2)),$((LN+2))p" "$F"
            done
          fi
          exit $RC

      - name: Gate 3 - link probe
        run: |
          set -e
          mkdir -p build-stage3
          FIRST=$(awk 'NR==2{print $1}' generated/stage3/manifest.tsv)
          SYM="sub_${FIRST#0x}"
          echo "probe symbol: $SYM"
          g++ -std=c++17 -O1 -I runtime/include -I generated/stage3 \
              -DPROBE_SYM="$SYM" tests/stage3/link_probe.cpp \
              build-stage3/libmew_recomp.a -o build-stage3/link_probe 2>&1 | tee generated/link.log
          ./build-stage3/link_probe | tee -a generated/link.log

      - name: Gate 1 - stage 2 single function replay (hard gate)
        run: |
          set +e
          if ! command -v wine >/dev/null; then
            echo "GATE1 SKIPPED: wine 未安装（本环境无 MinGW/Wine 对拍能力）"
            exit 0
          fi
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=err+all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          timeout 120 wineboot -q > /dev/null 2>&1
          sleep 2
          x86_64-w64-mingw32-gcc -O1 -o build-stage3/guest_harness.exe tests/stage2/guest_harness.c 2>/dev/null
          VA=1401657b0
          MASK=0xb
          ./build/mew_lifter --lift 0x$VA --exe Mewgenics.exe --out generated/gate1_lifted.cpp > generated/gate1_lift.log 2>&1 || { echo "GATE1 lift failed"; tail -5 generated/gate1_lift.log; exit 1; }
          python3 tools/stage2_wrap.py "$VA" generated/gate1_wrap.cpp > /dev/null
          g++ -O1 -std=c++17 -I runtime/include \
              tests/stage2/native_harness.cpp generated/gate1_lifted.cpp generated/gate1_wrap.cpp \
              -o build-stage3/gate1_native 2> generated/gate1_build.log || { echo "GATE1 build failed"; tail -8 generated/gate1_build.log; exit 1; }
          OK=1
          for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
            ./build-stage3/gate1_native "$MASK" $ARGS > generated/gate1_native.out 2>/dev/null || { echo "GATE1 native crash [$ARGS]"; OK=0; continue; }
            timeout 90 wine build-stage3/guest_harness.exe Mewgenics.exe "0x$VA" "$MASK" $ARGS \
              > generated/gate1_guest.out 2> generated/gate1_guest.err
            if [ $? -ne 0 ]; then echo "GATE1 guest failed [$ARGS]"; tail -3 generated/gate1_guest.err; OK=0; continue; fi
            python3 tools/stage2_compare.py generated/gate1_guest.out generated/gate1_native.out >> generated/gate1_compare.log 2>&1 || { echo "GATE1 mismatch [$ARGS]"; OK=0; }
          done
          echo "--- gate1 compare ---"; tail -12 generated/gate1_compare.log 2>/dev/null
          if [ "$OK" -ne 1 ]; then echo "GATE1 FAILED: 阶段2 单函数对拍回归"; exit 1; fi
          echo "GATE1 PASSED 0x$VA"

      - name: Stage 4 - candidate loop (native vs Wine byte-level)
        run: |
          set +e
          if ! command -v wine >/dev/null; then
            echo "STAGE4 SKIPPED: wine 未安装"
            exit 0
          fi
          mkdir -p build-stage3 generated
          x86_64-w64-mingw32-gcc -O1 -o build-stage3/guest_nested.exe tests/stage4/guest_nested.c 2>&1 | tee generated/guest4_build.log
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=err+all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          timeout 120 wineboot -q > /dev/null 2>&1
          sleep 2
          : > generated/verify4.log
          BEST=""
          for K in 0 1 2 3 4 5 6 7; do
            if ! ./build/mew_lifter --pick-nested --skip $K --exe Mewgenics.exe --out generated/nested_$K.txt > /dev/null 2>&1; then
              echo "no more candidates at K=$K" | tee -a generated/verify4.log
              break
            fi
            ROOT=$(awk '/^# root/{print $3}' generated/nested_$K.txt | sed 's/va=0x//')
            MASK=$(awk '/^# root/{for(i=1;i<=NF;i++) if($i ~ /^mask=/) print substr($i,6)}' generated/nested_$K.txt)
            echo "cand $K root=0x$ROOT mask=$MASK" >> generated/verify4.log
            DIR=generated/stage4_$K
            rm -rf "$DIR"; mkdir -p "$DIR"
            ./build/mew_lifter --shards 1 --only generated/nested_$K.txt --out-dir "$DIR" --exe Mewgenics.exe > /dev/null 2>&1
            python3 tools/stage2_wrap.py "$ROOT" generated/nested_wrap_$K.cpp > /dev/null
            if ! g++ -std=c++17 -O1 -I runtime/include -I "$DIR" \
                 tests/stage4/native_nested.cpp "$DIR/shard_000.cpp" "$DIR/dispatch_table.cpp" \
                 "$DIR/shims_auto.cpp" runtime/src/pe_image_loader.cpp generated/nested_wrap_$K.cpp \
                 -o build-stage3/native_nested_$K > generated/native4_build_$K.log 2>&1; then
              echo "cand $K: native build failed" | tee -a generated/verify4.log
              tail -5 generated/native4_build_$K.log | tee -a generated/verify4.log
              continue
            fi
            OK=1
            for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
              ./build-stage3/native_nested_$K "${MASK:-15}" $ARGS > generated/n4_${K}.out 2> generated/n4_${K}.err
              NRC=$?
              timeout 90 wine build-stage3/guest_nested.exe Mewgenics.exe "0x$ROOT" "${MASK:-15}" $ARGS \
                > generated/g4_${K}.out 2> generated/g4_${K}.err
              GRC=$?
              if [ $NRC -ne 0 ] || [ $GRC -ne 0 ]; then
                echo "cand $K [$ARGS] native rc=$NRC guest rc=$GRC" | tee -a generated/verify4.log
                tail -2 generated/g4_${K}.err | tee -a generated/verify4.log
                OK=0; break
              fi
              if ! python3 tools/stage2_compare.py generated/g4_${K}.out generated/n4_${K}.out >> generated/verify4.log 2>&1; then
                OK=0; break
              fi
            done
            if [ $OK -eq 1 ]; then
              echo "NESTED PASS cand=$K root=0x$ROOT" | tee -a generated/verify4.log
              BEST=$K
              break
            fi
          done
          echo "--- verify4.log ---"; tail -40 generated/verify4.log
          if [ -n "$BEST" ]; then echo "STAGE4 PASSED cand=$BEST"; exit 0; fi
          echo "STAGE4: no candidate passed"; exit 1

      - name: Dump stage3b bodies of abort chain
        run: |
          : > generated/stage3b_abort_chain.txt
          # 2026-11-28：卡点从「锁自旋」追到「out 槽被写成垃圾」，怀疑生成代码本身
          # 跟源指令不一致。这几个 VA 是证据链上的关键几环：
          #   140be0980  填槽 + `call [rsp+0x38]` 的宿主（[rsp-repair] delta=0 -> 8 就是它）
          #   140bfef60  填槽例程（按 rcx/rdx/r8/r9 四个形参条件写指针）
          #   140bb0660  调用 140be0980 的那一层
          # 先扫 stage3（主构建）再回落 stage3b（reflow 构建）：run 46042045237 里
          # 三个新 VA 只有标题没有正文，因为它们不在 stage3b 的种子集里，awk 扫不到。
          for VA in 140d79870 140d79928 140d79600 140be0980 140bfef60 140bb0660 140c88b20 140bfcad0 140bfda50; do
            echo "===== body sub_$VA (stage3) =====" >> generated/stage3b_abort_chain.txt
            awk "/void sub_$VA\\(X64Ctx/,/^}/" generated/stage3/shard_*.cpp >> generated/stage3b_abort_chain.txt 2>/dev/null || true
            echo "===== body sub_$VA (stage3b) =====" >> generated/stage3b_abort_chain.txt
            awk "/void sub_$VA\\(X64Ctx/,/^}/" generated/stage3b/shard_*.cpp >> generated/stage3b_abort_chain.txt 2>/dev/null || true
          done
          wc -l generated/stage3b_abort_chain.txt
          wc -l generated/stage3b_abort_chain.txt

      - name: Stage 5 - build launcher
        run: |
          set +e
          g++ -std=c++17 -O0 -g -rdynamic -I runtime/include -I shims -I generated/stage3 \
            runtime/src/mew_runner.cpp runtime/src/pe_image_loader.cpp shims/win32_kernel32.cpp \
            build-stage3/libmew_recomp.a -o build-stage3/mew_runner \
            -lpthread 2>&1 | tee generated/runner_build.log
          ls -l build-stage3/mew_runner

      # 实验（纯 yml）：预置一个空 settings.txt，让 CreateFileW(".../settings.txt") 成功。
      # 依据 run 46149048002：3756 行 settings.txt 打开失败(nil)，3757 行立刻落
      # [SAFE] read 0x38 in_fn=0x140d77dd4（rdx=0x80000000=GENERIC_READ）。
      # 6 条表族 SAFE 若因此消失/减少 → (A) 失败路径：-1 fd 被拿去算块号；
      # 一条不少 → (B) 分配路径，与 settings 无关。
      - name: 预置 settings.txt（实验：让 _open 成功，看表族 SAFE 是否消失）
        run: |
          mkdir -p "Mewgenics/Glaiel Games/Mewgenics/0/logs"
          : > "Mewgenics/Glaiel Games/Mewgenics/0/settings.txt"
          ls -la "Mewgenics/Glaiel Games/Mewgenics/0/" | head -20
      - name: Stage 5 - run launcher (log driven)
        run: |
          set +e
          # 观测那个「cookie 解码链表」函数：看它的 rcx / [rcx] 以及两条哨兵全局、cookie 的真实值
          # 本轮（a64051b 之后）新增三样观测：
          #   1) MEW_WATCH 补 _Myhead(b8) / _Vec(c8,d0,d8) / _Mask(e0)：9 次插入里
          #      到底哪一步分配了桶数组、mask 有没有被 rehash 改掉，看得到就不必再猜。
          #   2) MEW_TRACE_FN 补 0x140386180：那是 mlf 检查失败后唯一被 call 的
          #      "算新桶数"函数（无 .pdata，但是直接 call 目标，lifter 会当函数入口）。
          #   3) MEW_CALL_MAIN=1：CRT 的 `ret` 是 return 回宿主，_initterm 跑完不会
          #      自己走到 main，必须链尾显式补一次。
          #   4) 守卫 0x1413c4758 已结案（run 46069971296：全场只被写一次、值=1，
          #      in_fn=0x140a3ae10，之后 240 条全是读 1，没有写回 0/2），
          #      而且那条链属于 CRT 的 onexit 退出路径，不是 exit(3) 的原因。
          #      现在换成本轮真正要看的两个 .data 运行期跳板槽：
          #        0x1412e8800  0x140ba7e50 的 jmp [slot]，CRT 经 0x1409b5140 尾跳进 WinMain
          #        0x1412e8588  0x140ba7850 的 jmp [slot]，appmain 末尾尾调用的那个函数
          #      这两个槽在文件里是 0（没有延迟导入目录），运行期才被填成函数指针；
          #      看 [watch] R 打出来的 val 就知道真实目标地址。
          # ★ 注意：下面的 env 用反斜杠续行，**注释必须写在整条链的上面**。
          #   插在链中间（注释行夹在 MEW_TRACE_FN \ 和 MEW_WATCH 之间）会把续行
          #   打断：MEW_TRACE_FN 变成一条独立赋值（不进 runner 环境），后面的
          #   MEW_WATCH/MEW_SAMPLE_SEC… 另起一条命令。run 46149048002 和
          #   46151590541 就是这样丢了 MEW_TRACE_FN（整轮 [fn] 行数 = 0），
          #   别把「[fn] 某函数 0 次」误读成行为变化。
          # 本轮（F+E2+G）新增两样观测，纯观测不改行为：
          #   a) MEW_WATCH 补 0x1413bb7f0：那是 0x140d77340 惰性建表用的 128 项分块
          #      指针表首项（r12 = 0x1413bb7f0）。disasm（run 46148219285）证明正常路径
          #      下 0x140d7743d 那条写的 rax 不可能为 0（进搜索分支前 jne 已判
          #      table[ebx] != 0，且 r8 == ebx），除非有线程把表项清成 0 —— 所以看这条
          #      地址上的 W 值就能证伪/证实「假互斥」这条（G 修的就是它）。
          #   a2) MEW_WATCH 补 0x1413bbbf0：全局「已分配槽数」。兄弟函数 0x140d77480
          #      用它当护栏（cmp ebx,[0x1413bbbf0]; jae 失败返回），而 0x140d77340
          #      不用它、直接 r8=(ebx*64+slot)>>6 索引 —— 这个不对称正是「计数与表
          #      内容短暂不一致」的入口，所以要看它有没有被减/被清零。
          #   b) MEW_TRACE_FN 里 0x140d676d8 / 0x140d6772c 已撤（CRT 的 _lock/_unlock，
          #      rcx 是小整数锁号、rdx 是垃圾临时值，探针三行对它们无意义，各烧掉 800 行）。
          #   b2) 阶段 5 定位「停在哪一步」的 7 个阶段函数（run 46159179391 之后）：
          #      appmain 的调用序是 initSystems(0x1409b5380) → vtable+0x40 → ProcessCmds
          #      (0x1409b8bb0) → vtable+0 → swflist → 窗口模式(0x1409b58b0) → RefreshWindow
          #      (0x1409b6c00, 里面才有 "Could not create window/gl context: " 两条字面量)
          #      → initGraphics(0x1409b5ed0) → SWF::load → Director 主循环。
          #      判据就一条：最后一个出现的 [fn] 是谁。RefreshWindow 有 [fn] 说明建窗那步
          #      真进了；initGraphics 的 [fn] 为 0 就不是「GL 部分没执行」而是整个没进去。
          # MEW_WATCH_N 从 0（不封顶）改成 2000（每地址独立）：新加的 0x1413bb7f0/bbf0
          # 是被扫描循环反复读的热地址，不封顶会把日志冲成十几万行；老三条地址实测
          # 各自只有 1x 条事件，2000 对它们等价于不封顶。
          #   c) MEW_WATCH 再补 0x1413b46e0 / 0x1413b46f0：CALL RING 里 0x140bf4fd0 /
          #      0x140bf4ff0 不是函数，是蹦床（48 85 c9 74 07 48 ff 25 … = test rcx,rcx;
          #      je ret; jmp [.data 槽]），真实目标只在运行期填进这两个 .data 槽。
          #      看它们的 W 值就知道尾跳落到哪；读洪水由 MEW_WATCH_N 每地址上限兜住。
          MEW_TRACE_FN=0x140d7a31c,0x140d6a8b4,0x140385f80,0x140025400,0x1400598f0,0x140386250,0x140d6aec8,0x140386180,0x1409b5230,0x1409b5140,0x140ba3a40,0x140ba6f90,0x140ba6fd0,0x140d64d48,0x140a3af80,0x140ba5070,0x140b9aa90,0x140c15800,0x140c15820,0x1409da290,0x140a5c8b0,0x140c90160,0x140c7e260,0x140c7eba0,0x140ce2910,0x140be76d0,0x140bf9a50,0x140c7d4b0,0x140bfb770,0x140c7d310,0x140bef420,0x140bf9700,0x140bc8f60,0x140bfe390,0x140bdede0,0x140b4e250,0x140c7f740,0x140bef6f0,0x140c8ead0,0x140c85400,0x140c88b20,0x140c8e8a0,0x140c861d0,0x140c8d9b0,0x140be7d20,0x140c7f440,0x140be7ee0,0x140bb0720,0x140bc2810,0x140c8a720,0x140be8190,0x140be81d0,0x140a28500,0x140d1ba18,0x140026890,0x140a27ca0,0x140d1ba40,0x140d1f7e4,0x140d77340,0x140d775b4,0x140d77dd4,0x1409b5380,0x1409b8bb0,0x1409b58b0,0x1409b6c00,0x1409b5ed0,0x140a10240,0x140745f60 \
          MEW_WATCH=0x1412f7fb0,0x1412f7ff8,0x1412f7ffc,0x1413bb7f0,0x1413bbbf0,0x1413b46e0,0x1413b46f0 \
          MEW_SAMPLE_SEC=60 MEW_TRACE_IND=1 MEW_ABI_GUARD=1 MEW_STACK_REPAIR=1 MEW_SEH_DISPATCH=1 MEW_SEH_PHASE2=1 MEW_SEH_SKIP_INIT=1 MEW_SEED_MLF=1 MEW_CALL_MAIN=1 MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 MEW_WATCH_N=2000 MEW_LIVELOCK_N=0 MEW_TRACE_N=800 MEW_CS_LOG_N=400 MEW_CS_LOG_MIN=0x10000000 MEW_PASS_ENV=SDL_ SDL_VIDEODRIVER=dummy SDL_VIDEO_DRIVER=dummy SDL_LOGGING='*:debug' timeout 600 ./build-stage3/mew_runner Mewgenics.exe > generated/runner.out 2> generated/runner.err
          echo "runner rc=$?" | tee -a generated/runner.out
          echo "--- stdout tail ---"; tail -20 generated/runner.out
          echo "--- unimpl/api log (first 40) ---"
          grep -E '\[UNIMPL (INSN|API|FUNC)\]|\[shim\]|\[game\]' generated/runner.err | head -200 | tee generated/runner_api.log
          echo "--- counts ---"
          grep -c '\[UNIMPL INSN\]' generated/runner.err
          grep -c '\[UNIMPL API\]' generated/runner.err
          grep -c '\[UNIMPL FUNC\]' generated/runner.err || true
          echo '--- runner.err tail 40 (print ring trace) ---'
          tail -40 generated/runner.err
          echo '--- trace blocks ---'
          grep -n 'CALL RING TRACE' generated/runner.err | head -5 || true
          exit 0

      - name: Stage 5 alt2 - run WITHOUT skip-init (does the CRT write [0x140e3f620]?)
        run: |
          # 假设（2026-11-28）：run 46023439342 卡死在 0x140d1f7e4 里一次
          # `call qword [0x140e3f620]`。这条槽只有三个静态调用点
          # （0x140d1f803 / 0x140d1fe22 / 0x140d3e1f1），其中 0x140d3e1f1 落在
          # CRT 初始化区（0x140d3e0xx，__scrt_common_main_seh 就在 0x140d3e738 附近），
          # 说明这个指针**应该是 CRT 初始化期间写进去的**；而我们一直在用
          # MEW_SEH_SKIP_INIT=1 跳过 index=2339 那个初始化器。
          # 所以这一趟把 SKIP_INIT 关掉：如果槽被正确写入、锁不再自旋，
          # 就证明「当年为了绕过崩溃而跳过的那一条初始化器，正是这里缺的那一步」，
          # 而且那批 chaininfo/RVA 表/SSE 修复之后 2339 很可能已经不再崩了。
          set +e
          MEW_SEH_DISPATCH=1 MEW_SEH_PHASE2=1 MEW_SEED_MLF=1 MEW_CALL_MAIN=1 \
          MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 MEW_ABI_GUARD=1 MEW_STACK_REPAIR=1 \
          MEW_SAMPLE_SEC=30 MEW_TRACE_IND=1 \
          timeout 600 ./build-stage3/mew_runner Mewgenics.exe \
            > generated/runner_noskip.out 2> generated/runner_noskip.err
          echo "runner_noskip rc=$?" | tee -a generated/runner_noskip.out
          echo "--- noskip: 跳过初始化器 / SAMPLE / indring ---"
          grep -E '跳过初始化器|RESUME #|\[SAMPLE\]|\[indring\] target=' generated/runner_noskip.err | tail -30 || true
          echo "--- noskip: TIMEOUT/CRASH ---"
          grep -E '\[TIMEOUT\]|\[CRASH\]' generated/runner_noskip.err | head -5 || true
          echo "--- noskip tail 20 ---"
          tail -20 generated/runner_noskip.err
          exit 0

      - name: Stage 5 direct - call gpak loader with a zeroed object
        run: |
          set +e
          for T in 0x1409b5380 0x1409b9970; do
            echo "=== --call-obj $T ===" | tee -a generated/gpak_direct.log
            MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 timeout 60 ./build-stage3/mew_runner Mewgenics.exe \
              --call-obj "$T" 65536 > generated/gpak_${T}.out 2> generated/gpak_${T}.err
            echo "rc=$?" | tee -a generated/gpak_direct.log
            grep -E 'STAGE5|CreateFileW|resources\.gpak|ReadFile|UNIMPL FUNC' generated/gpak_${T}.err | head -20 | tee -a generated/gpak_direct.log
            if grep -q 'STAGE5 PASS' generated/gpak_${T}.err; then
              echo "GPAK ACCEPTANCE PASS at $T" | tee -a generated/gpak_direct.log
            fi
            true
          done
      - name: Stage 5 alt - run WITHOUT safe-mem (native backtrace of the real crash)
        run: |
          set +e
          MEW_ABI_GUARD=1 MEW_STACK_REPAIR=1 MEW_SEH_DISPATCH=1 MEW_SEH_PHASE2=1 MEW_SEED_MLF=1 MEW_UNIMPL_CONTINUE=1 timeout 120 ./build-stage3/mew_runner Mewgenics.exe \
            > generated/runner_nosafe.out 2> generated/runner_nosafe.err
          echo "nosafe rc=$?"
          echo '--- crash backtrace ---'
          grep -A30 '\[CRASH\]' generated/runner_nosafe.err | head -40
          echo '--- dispatch trace of initializer loop ---'
          grep -E '\[disp#|-> done|\[fn\]|\[ret\]' generated/runner.err | head -60
          echo '--- ABI violations ---'
          grep 'ABI VIOLATION' generated/runner_nosafe.err | head -20
          echo '--- last shim/api lines ---'
          grep -E '\[api\]|\[shim\] (Fls|InitializeCritical|HeapAlloc|CreateFile)' generated/runner_nosafe.err | tail -15

      - name: Stage 5 - walk up call chain to gpak open
        run: |
          set +e
          python3 -c "import struct;open('resources.gpak','wb').write(b'GPAK'+struct.pack('<II',1,0)+b'\0'*(65536-12))"
          ls -l resources.gpak
          : > generated/gpak_call.log
          VA=0x1409b9970
          for LEVEL in 1 2 3 4 5; do
            echo "=== level $LEVEL call $VA ===" | tee -a generated/gpak_call.log
            MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 timeout 45 ./build-stage3/mew_runner Mewgenics.exe \
              --call "$VA" > generated/gpak_call_$LEVEL.out 2> generated/gpak_call_$LEVEL.err
            echo "rc=$?" | tee -a generated/gpak_call.log
            grep -E '\[shim\] (CreateFileW|ReadFile|HeapAlloc)|resources\.gpak' generated/gpak_call_$LEVEL.err | head -12 | tee -a generated/gpak_call.log
            if grep -q 'resources.gpak' generated/gpak_call_$LEVEL.err; then
              echo "GPAK OPENED at level $LEVEL va=$VA" | tee -a generated/gpak_call.log
              break
            fi
            NEXT=$(./build/mew_lifter --find-callers "$VA" --exe Mewgenics.exe 2>/dev/null | awk '/caller=/{gsub("caller=","");gsub("->.*","");for(i=1;i<=NF;i++) if ($i ~ /^0x/) {print $i; exit}}' | head -1)
            if [ -z "$NEXT" ] || [ "$NEXT" = "$VA" ]; then
              echo "no caller beyond $VA" | tee -a generated/gpak_call.log
              break
            fi
            VA=$NEXT
          done
          echo "--- tail of last err ---"
          tail -25 generated/gpak_call_$LEVEL.err | tee -a generated/gpak_call.log

      - name: Stage 5b - reflow runtime-missed entries (second build)
        env:
          MEW_SPLIT_CHAIN: "1"
        run: |
          set -euo pipefail
          if [ ! -s discovered_entries.txt ]; then
            echo "no runtime-missed entries recorded"; exit 0
          fi
          python3 - <<'PYEOF' > generated/runtime_seeds.txt
          import re
          v = set()
          for line in open('discovered_entries.txt'):
              m = re.match(r'0x([0-9a-fA-F]+)', line.strip())
              if m:
                  va = int(m.group(1), 16)
                  # 不再要求 16 字节对齐：MSVC 常把叶子函数/thunk 打包进同一条 .pdata，
                  # 目标可能是 +8 这类非对齐地址（实测 0x140d6adc8、0x140bc5e04 全被误杀）
                  if 0x140001000 <= va < 0x140e3f000:
                      v.add(va)
          for va in sorted(v):
              print('0x%x' % va)
          PYEOF
          echo "runtime seeds: $(wc -l < generated/runtime_seeds.txt)"
          test -s generated/runtime_seeds.txt || echo "WARN: no runtime seeds this round (nothing discovered)"
          cat generated/extra_seeds.txt generated/runtime_seeds.txt | sort -u > generated/all_seeds.txt
          echo "all seeds: $(wc -l < generated/all_seeds.txt)"
          # 二次构建的 --seeds-inside = 静态挖出的跳转表 case + 上一轮运行期发现的入口。
          # 两者都必须走 inside 通道，否则落在函数体内的会被静默丢掉。
          cat generated/inside_seeds.txt generated/runtime_seeds.txt | sort -u > generated/all_inside.txt
          echo "all inside seeds: $(wc -l < generated/all_inside.txt)"
          mkdir -p generated/stage3b
          ./build/mew_lifter --shards 64 --out-dir generated/stage3b --seeds generated/all_seeds.txt \
              --seeds-inside generated/all_inside.txt --exe Mewgenics.exe 2>&1 | tail -6
          python3 tools/build_stage3.py \
            --src-dir generated/stage3b --obj-dir build-stage3b \
            --archive build-stage3b/libmew_recomp.a --jobs "$(nproc)" --opt=-O0 2>&1 | tail -6
          g++ -std=c++17 -O0 -g -rdynamic -I runtime/include -I shims -I generated/stage3b \
            runtime/src/mew_runner.cpp runtime/src/pe_image_loader.cpp shims/win32_kernel32.cpp \
            build-stage3b/libmew_recomp.a -o build-stage3b/mew_runner -lpthread 2>&1 | tail -5
          ls -l build-stage3b/mew_runner 2>/dev/null || { echo "second build: runner missing"; exit 0; }
          python3 -c "import struct;open('resources.gpak','wb').write(b'GPAK'+struct.pack('<II',1,0)+b'\0'*(65536-12))"
          # runner 以 fastfail(3) 退出是预期行为，不能让它把 set -e 脚本打断
          RC=0
          MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 timeout 120 ./build-stage3b/mew_runner Mewgenics.exe \
            > generated/runner_b.out 2> generated/runner_b.err || RC=$?
          echo "runner_b rc=$RC"
          echo "misses_b=$(grep -c 'Unmapped indirect target' generated/runner_b.err || true)"
          echo "fastfail_b=$(grep -c 'FASTFAIL' generated/runner_b.err || true)"
          echo "gpak_refs_b=$(grep -c 'resources.gpak' generated/runner_b.err || true)"
          tail -25 generated/runner_b.err
          # 复跑一次：看 abort 判定函数 0x140d79870 的入参 + 关键全局的读写打点
          RC=0
          MEW_WATCH=0x200001088,0x200001090,0x2000013a8,0x1413bbc18 MEW_TRACE_FN=0x140d79870 \
            MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 timeout 120 \
            ./build-stage3b/mew_runner Mewgenics.exe > generated/runner_bt.out 2> generated/runner_bt.err || RC=$?
          echo "runner_bt rc=$RC"
          echo "watch_w=$(grep -c '\[watch\] W' generated/runner_bt.err || true)"
          (grep -nE '^\[fn\]|^\[FASTFAIL\]|^\[watch\]|\[fn:|\[rsi\]|\[rdi\+0x88\]|\[rbx\]' generated/runner_bt.err > generated/bt_grep.txt || true)
          head -40 generated/bt_grep.txt || true
          # 第三趟：真正打开 SEH 派发（MEW_SEH_DISPATCH=1），看 try/catch 能不能落地
          RC=0
          MEW_SEH_DISPATCH=1 MEW_UNIMPL_CONTINUE=1 MEW_SAFE_MEM=1 timeout 180 \
            ./build-stage3b/mew_runner Mewgenics.exe > generated/runner_se.out 2> generated/runner_se.err || RC=$?
          echo "runner_se rc=$RC"
          echo "seh_frames=$(grep -c '\[seh\] depth=' generated/runner_se.err || true)"
          echo "seh_handlers=$(grep -c 'handler 0x' generated/runner_se.err || true)"
          echo "seh_resume=$(grep -c 'RESUME #' generated/runner_se.err || true)"
          echo "seh_unhandled=$(grep -c 'unhandled' generated/runner_se.err || true)"
          (grep -E '\[seh\]' generated/runner_se.err || true) | head -60 || true

