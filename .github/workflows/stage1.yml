name: Stage 1 scan (PE meta + ISA histogram)

on:
  push:
    paths:
      - '.stage1-trigger'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake ninja-build g++ python3-pip git
          python3 -m pip install --quiet lief
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: Install Zydis
        run: |
          set -e
          if sudo apt-get install -y -qq libzydis-dev; then
            echo "apt zydis ok"
          else
            echo "building Zydis from source"
            git clone --depth 1 --branch v4.1.0 https://github.com/zyantific/zydis.git /tmp/zydis
            cmake -S /tmp/zydis -B /tmp/zydis/build -G Ninja -DZYDIS_BUILD_TESTS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_TOOLS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
            cmake --build /tmp/zydis/build -j"$(nproc)" > /dev/null
            sudo cmake --install /tmp/zydis/build > /dev/null
            sudo ldconfig
          fi
          ls /usr/include/Zydis/Zydis.h || true

      - name: Fetch Mewgenics.exe
        run: |
          curl -fL -o Mewgenics.exe https://raw.githubusercontent.com/871554520/mew-decomp/main/Mewgenics.exe
          ls -l Mewgenics.exe
          sha256sum Mewgenics.exe

      - name: Build scanner
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Stage 1 — PE metadata + imports
        run: |
          mkdir -p generated
          python3 tools/scan_pe_and_isa.py Mewgenics.exe generated/pe_meta.json | tee generated/pe_scan.log

      - name: Stage 1 — ISA histogram
        run: |
          ./build/isa_histogram Mewgenics.exe generated/isa_histogram.json | tee generated/isa_scan.log
          python3 - <<'PY'
import json
d = json.load(open('generated/isa_histogram.json'))
mn = d['mnemonics']
total = d['instructions']
print('total instructions', total, 'mnemonics', len(mn))
top = sorted(mn.items(), key=lambda kv: -kv[1])
acc = 0
for i, (k, v) in enumerate(top[:30], 1):
    acc += v
    print('%2d. %-10s %8d  %5.2f%%  cum %5.2f%%' % (i, k, v, 100*v/total, 100*acc/total))
cover = 0
for n in (60, 100, 120, 150, 200):
    acc = sum(v for _, v in top[:n])
    print('top %d -> %.2f%% coverage' % (n, 100*acc/total))
PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-out
          path: |
            generated/pe_meta.json
            generated/isa_histogram.json
            generated/pe_scan.log
            generated/isa_scan.log
          if-no-files-found: warn
