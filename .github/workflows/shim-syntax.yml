name: 垫片/宿主语法门禁（约 1 分钟）

# 背景：stage3 一轮要 40 分钟，而「shim 里用了一个不存在的函数」这种错误
# 会让第 20 步直接失败、后面 5 个跑起来的步骤全被跳过，等于整轮白跑。
# 这个 job 只做 -fsyntax-only，30 秒内把编译错误打出来，和 stage3 并行跑。

on:
  push:
    paths:
      - 'shims/**'
      - 'runtime/**'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Gate 0：比 g++ 快十几毫秒，专门抓「kApis 表引用了没前置声明的垫片函数」。
      # 这次 H 就是这么挂的（shim_KERNEL32_VerSetConditionMask not declared），
      # 有了这步，报错会直接给出可以贴回声明区的那一行。
      - name: Gate 0 - kApis 声明显式检查
        run: python3 tools/check_shim_decls.py shims/win32_kernel32.cpp

      - name: 装 g++
        run: |
          if ! command -v g++ >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++
          fi
          g++ --version | head -1

      - name: 语法检查（不产出目标文件）
        run: |
          set -euo pipefail
          rc=0
          : > /tmp/syntax_all.log
          for f in shims/win32_kernel32.cpp runtime/src/mew_runner.cpp runtime/src/pe_image_loader.cpp; do
            echo "===== $f =====" >> /tmp/syntax_all.log
            g++ -std=c++17 -fsyntax-only -Wall -Wextra \
                -Wno-unused-parameter -Wno-unused-variable -Wno-sign-compare \
                -I runtime/include -I shims "$f" >> /tmp/syntax_all.log 2>&1 || rc=1
          done
          echo "--- 编译输出 ---"
          cat /tmp/syntax_all.log
          echo "error 行数: $(grep -c 'error:' /tmp/syntax_all.log || true)"
          # 把前 10 条 error 转成 GitHub annotation：日志接口要 admin 权限，
          # 但 check-runs/annotations 是公开可读的，这样谁能读仓库谁就能看到错在哪。
          grep -m 10 'error:' /tmp/syntax_all.log | while IFS= read -r line; do
            echo "::error title=compile::$line"
          done || true
          if [ "$rc" -ne 0 ]; then
            echo "::error title=syntax-gate::语法门禁未通过（具体错误见上面的 annotations）"
            exit 1
          fi
          echo "语法门禁通过"
