name: pcmp hw check (real SSE4.2 vs our model)

on:
  workflow_dispatch:

jobs:
  hw:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: model self-test (pure python)
        run: python3 tools/test_pcmp_semantics.py

      - name: generate C cases from the model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('m', 'tools/test_pcmp_semantics.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          out = ['#include <smmintrin.h>', '#include <stdio.h>', 'static int fails;']
          out.append('static void ck(const char* n, const unsigned char* a, const unsigned char* b, int la, int lb, int imm, unsigned model, int allow_diff){')
          out.append('  __m128i va=_mm_loadu_si128((const __m128i*)a), vb=_mm_loadu_si128((const __m128i*)b);')
          out.append('  __m128i r=_mm_cmpestrm(va, la, vb, lb, imm);')
          out.append('  unsigned hw=(unsigned)_mm_extract_epi16(r,0)&0xffffu;')
          out.append('  const char* tag=(hw==model)?"MATCH":(allow_diff?"DIFF-ALLOWED":"MISMATCH");')
          out.append('  if(hw!=model && !allow_diff) ++fails;')
          out.append('  printf("case %-42s hw=0x%04x model=0x%04x %s\\n", n, hw, model, tag);')
          out.append('}')
          out.append('int main(void){')
          for name,a,b,nA,nB,imm,want in m.CASES:
              pa=(a+b'\x00'*16)[:16]; pb=(b+b'\x00'*16)[:16]
              model=m.pcmp_core(pa,pb,nA,nB,imm)
              allow=1 if '前缀' in name else 0
              ba=','.join(str(x) for x in pa); bb=','.join(str(x) for x in pb)
              nc=name.replace('"','\\"')
              out.append(f'  {{ static const unsigned char a[16]={{{ba}}}; static const unsigned char b[16]={{{bb}}};')
              out.append(f'    ck("{nc}", a, b, {nA}, {nB}, 0x{imm:02x}, 0x{model:04x}u, {allow}); }}')
          out.append('  printf("\\nfails=%d\\n", fails);')
          out.append('  return fails ? 1 : 0;')
          out.append('}')
          open('/tmp/pcmp_hw.c','w').write('\n'.join(out))
          print('generated', len(m.CASES), 'cases')
          PY

      - name: compile and run on real hardware
        run: |
          set -euo pipefail
          gcc -O2 -msse4.2 /tmp/pcmp_hw.c -o /tmp/pcmp_hw
          /tmp/pcmp_hw
