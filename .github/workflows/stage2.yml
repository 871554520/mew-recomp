name: Stage 2 PoC (single function byte-level check)

on:
  push:
    paths:
      - '.stage2-trigger'
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            cmake ninja-build g++ clang python3-pip git \
            gcc-mingw-w64-x86-64 wine64 xvfb
          python3 -m pip install --quiet lief
          wine --version || true
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Install Zydis
        run: |
          set -e
          if ! sudo apt-get install -y -qq libzydis-dev; then
            git clone --depth 1 --branch v4.1.0 https://github.com/zyantific/zydis.git /tmp/zydis
            cmake -S /tmp/zydis -B /tmp/zydis/build -G Ninja -DZYDIS_BUILD_TESTS=OFF -DZYDIS_BUILD_EXAMPLES=OFF -DZYDIS_BUILD_TOOLS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
            cmake --build /tmp/zydis/build -j"$(nproc)" > /dev/null
            sudo cmake --install /tmp/zydis/build > /dev/null
            sudo ldconfig
          fi
          ls /usr/include/Zydis/Zydis.h

      - name: Fetch exe
        run: |
          curl -fL -o Mewgenics.exe https://raw.githubusercontent.com/871554520/mew-decomp/main/Mewgenics.exe
          ls -l Mewgenics.exe

      - name: Build lifter
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Pick pure function
        run: |
          mkdir -p generated
          ./build/mew_lifter --pick --exe Mewgenics.exe | tee generated/pick.log
          head -1 generated/picked.txt

      - name: Lift it
        run: |
          read VA SIZE < generated/picked.txt
          echo "picked VA=$VA size=$SIZE" | tee generated/lift.log
          ./build/mew_lifter --lift 0x$VA --exe Mewgenics.exe --out generated/lifted.cpp | tee -a generated/lift.log
          python3 tools/stage2_wrap.py $VA generated/wrapper.cpp
          head -40 generated/lifted.cpp

      - name: Build native harness
        run: |
          g++ -O1 -std=c++17 -I runtime/include \
            tests/stage2/native_harness.cpp generated/lifted.cpp generated/wrapper.cpp \
            -o build/native_harness
          echo built

      - name: Build guest harness (Windows x86-64, run under Wine)
        run: |
          x86_64-w64-mingw32-gcc -O1 -o build/guest_harness.exe tests/stage2/guest_harness.c
          ls -l build/guest_harness.exe

      - name: Compare on several inputs
        run: |
          set -uo pipefail
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all
          read VA SIZE < generated/picked.txt
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          sleep 2
          PASS=0; FAIL=0
          for ARGS in "1 2 3 4" "0 0 0 0" "255 16 0 1" "123456789 987654321 0 7"; do
            echo "== args: $ARGS"
            ./build/native_harness $ARGS > generated/native.out 2> generated/native.err || echo "native failed" 
            wine build/guest_harness.exe Mewgenics.exe $VA $ARGS > generated/guest.out 2> generated/guest.err || echo "guest failed"
            cat generated/native.out
            cat generated/guest.out
            if python3 tools/stage2_compare.py generated/guest.out generated/native.out; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); fi
          done
          echo "PASS=$PASS FAIL=$FAIL"
          test $FAIL -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-out
          path: |
            generated/pick.log
            generated/picked.txt
            generated/lift.log
            generated/lifted.cpp
            generated/*.out
            generated/*.err
          if-no-files-found: warn
